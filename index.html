<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IC Hand Hygiene Audit - โรงพยาบาลพุนพิน</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
body { font-family: 'Sarabun', sans-serif; background:#f0f2f5; }
.header-banner { background: linear-gradient(135deg,#11998e,#38ef7d); color:#fff; padding:30px; border-radius:0 0 25px 25px; }
.card { border-radius:15px; box-shadow:0 4px 12px rgba(0,0,0,.05); border:none; }
.section-title { border-left:6px solid #11998e; padding-left:15px; font-weight:bold; color:#11998e; }
.radio-group-box { background:#fafafa; padding:18px; border-radius:12px; border:1px solid #eee; }
.other-input { display:none; margin-top:10px; }
.btn-check:checked + .btn-outline-primary { background:#0d6efd; color:#fff; }
.btn-check:checked + .btn-outline-info { background:#0dcaf0; color:#fff; }
.btn-check:checked + .btn-outline-danger { background:#dc3545; color:#fff; }
.btn-check:checked + .btn-outline-secondary { background:#6c757d; color:#fff; }
</style>
</head>

<body>

<div class="header-banner text-center mb-4">
    <h2 class="fw-bold"><i class="fas fa-hands-wash"></i> Hand Hygiene Audit</h2>
    <p class="mb-0 opacity-75">โปรแกรมบันทึกการล้างมือ - โรงพยาบาลพุนพิน</p>
</div>

<div class="container-fluid px-lg-5">
<div class="card p-4">

<h5 class="section-title mb-3"><i class="fas fa-edit"></i> บันทึกผลการสังเกตการณ์</h5>

<div class="row g-3 mb-4">
    <div class="col-md-3">
        <label class="fw-bold">วันที่สังเกต</label>
        <input type="date" id="obsDate" class="form-control form-control-lg">
    </div>
    <div class="col-md-2">
        <label class="fw-bold">เวลา</label>
        <input type="time" id="obsTime" class="form-control form-control-lg">
    </div>
</div>

<div class="row g-4">
    <!-- แผนก -->
    <div class="col-md-3">
        <label class="fw-bold text-primary">1. แผนก</label>
        <div class="radio-group-box">
            <div class="form-check"><input class="form-check-input" type="radio" name="deptRadio" value="OPD"> OPD</div>
            <div class="form-check"><input class="form-check-input" type="radio" name="deptRadio" value="IPD"> IPD</div>
            <div class="form-check"><input class="form-check-input" type="radio" name="deptRadio" value="LR"> LR</div>
            <div class="form-check"><input class="form-check-input" type="radio" name="deptRadio" value="ER"> ER</div>
            <div class="form-check"><input class="form-check-input" type="radio" name="deptRadio" value="อื่นๆ" onclick="toggleOther('deptOther',true)"> อื่นๆ</div>
            <input type="text" id="deptOther" class="form-control form-control-sm other-input" placeholder="ระบุแผนก">
        </div>
    </div>

    <!-- วิชาชีพ -->
    <div class="col-md-3">
        <label class="fw-bold text-primary">2. วิชาชีพ</label>
        <div class="radio-group-box">
            <div class="form-check"><input class="form-check-input" type="radio" name="roleRadio" value="แพทย์"> แพทย์</div>
            <div class="form-check"><input class="form-check-input" type="radio" name="roleRadio" value="พยาบาล"> พยาบาล</div>
            <div class="form-check"><input class="form-check-input" type="radio" name="roleRadio" value="ผู้ช่วยเหลือคนไข้"> ผู้ช่วยเหลือคนไข้</div>
            <div class="form-check"><input class="form-check-input" type="radio" name="roleRadio" value="นักศึกษาพยาบาล"> นักศึกษาพยาบาล</div>
            <div class="form-check"><input class="form-check-input" type="radio" name="roleRadio" value="อื่นๆ" onclick="toggleOther('roleOther',true)"> อื่นๆ</div>
            <input type="text" id="roleOther" class="form-control form-control-sm other-input" placeholder="ระบุวิชาชีพ">
        </div>
    </div>

    <!-- อุปกรณ์ -->
    <div class="col-md-6">
        <label class="fw-bold text-warning">3. ความพร้อมอุปกรณ์สนับสนุนการล้างมือ</label>
        <div class="row bg-light p-3 rounded-3">
            <div class="col-6">
                <div><input type="checkbox" class="equip"> อ่างล้างมือ</div>
                <div><input type="checkbox" class="equip"> สบู่เหลว</div>
                <div><input type="checkbox" class="equip"> 4% Chlorhexidine</div>
                <div><input type="checkbox" class="equip"> Alcohol hand rub</div>
            </div>
            <div class="col-6">
                <div><input type="checkbox" class="equip"> กระดาษเช็ดมือ</div>
                <div><input type="checkbox" class="equip"> โปสเตอร์สอนล้างมือ</div>
                <div><input type="checkbox" class="equip"> ถังขยะ</div>
            </div>
        </div>
    </div>
</div>

<!-- 5 Moments -->
<div class="mt-4 border-top pt-4">
    <h6 class="fw-bold text-success mb-3">4. การปฏิบัติ 5 Moments</h6>
    <div id="momentInputList" class="row g-3"></div>
</div>

<div class="text-end mt-4">
    <button class="btn btn-light border me-2" onclick="clearForm()">ล้างฟอร์ม</button>
    <button class="btn btn-success btn-lg px-5" onclick="saveData()">
        <i class="fas fa-save me-2"></i>บันทึกข้อมูล
    </button>
</div>

</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBrC7afQChoOR2RrSWUQXoX3B0pSkj-Vrrt0OIUSSd_Ms4YsLzPXUI5lvjm0QohtmD4w/exec";
const momentLabels = [
 "ก่อนสัมผัสผู้ป่วย",
 "ก่อนทำหัตถการปลอดเชื้อ",
 "หลังสัมผัสสารคัดหลั่งผู้ป่วย",
 "หลังสัมผัสผู้ป่วย",
 "หลังสัมผัสสิ่งรอบตัวผู้ป่วย"
];

window.onload = () => {
    const mDiv = document.getElementById('momentInputList');
    momentLabels.forEach((l,i)=>{
        mDiv.innerHTML += `
        <div class="col-md-4">
            <div class="p-3 border rounded bg-white">
                <label class="fw-bold small">${i+1}. ${l}</label>
                <div class="d-flex gap-2 flex-wrap mt-2">
                    <input type="radio" class="btn-check" name="m${i}" value="HW" id="m${i}hw"><label class="btn btn-outline-primary btn-sm" for="m${i}hw">HW</label>
                    <input type="radio" class="btn-check" name="m${i}" value="HR" id="m${i}hr"><label class="btn btn-outline-info btn-sm" for="m${i}hr">HR</label>
                    <input type="radio" class="btn-check" name="m${i}" value="None" id="m${i}no"><label class="btn btn-outline-danger btn-sm" for="m${i}no">ไม่ล้างมือ</label>
                    <input type="radio" class="btn-check" name="m${i}" value="Glove" id="m${i}gl"><label class="btn btn-outline-secondary btn-sm" for="m${i}gl">สวมถุงมือ</label>
                </div>
            </div>
        </div>`;
    });
};

function toggleOther(id,show){ document.getElementById(id).style.display = show?"block":"none"; }

function clearForm(){
    document.querySelectorAll('input').forEach(i=>i.checked=false);
    document.querySelectorAll('.other-input').forEach(i=>{i.value="";i.style.display="none";});
    obsDate.value=""; obsTime.value="";
}

function saveData(){
    if(!obsDate.value || !obsTime.value) return alert("กรุณากรอกวันที่และเวลา");
    if(!document.querySelector('input[name="deptRadio"]:checked')) return alert("กรุณาเลือกแผนก");
    if(!document.querySelector('input[name="roleRadio"]:checked')) return alert("กรุณาเลือกวิชาชีพ");

    const record = {
        obsDate: obsDate.value,
        obsTime: obsTime.value,
        dept: document.querySelector('input[name="deptRadio"]:checked').value,
        role: document.querySelector('input[name="roleRadio"]:checked').value,
        m: [0,1,2,3,4].map(i=>{
            const el=document.querySelector(`input[name="m${i}"]:checked`);
            return el?el.value:"";
        }),
        equips: [...document.querySelectorAll('.equip')].map(e=>e.checked?1:0)
    };

    fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(record)});
    alert("บันทึกข้อมูลเรียบร้อยแล้ว");
    clearForm();
}
</script>
</body>
</html>
